title: Login exitoso con User-Agent automatizado desde una IP con SQLi previa
id: 1b9de0c7-77aa-4a1f-81cd-si3006sql02
status: experimental
description: >
  Correlacion: si una misma IP genero un intento de SQLi y luego obtuvo HTTP 200
  en POST /rest/user/login con un User-Agent de cliente automatico, es muy
  probable un bypass de autenticacion exitoso.
references:
  - https://attack.mitre.org/techniques/T1078/
author: SI3006 - Equipo Ciberseguridad EAFIT
date: 2026/10/26
tags:
  - attack.defense_evasion
  - attack.t1078
  - cwe.287
  - cwe.89
logsource:
  category: webserver
  product: gcp
  service: cloud_run
detection:
  selection:
    httpRequest.requestMethod: 'POST'
    httpRequest.requestUrl|endswith: '/rest/user/login'
    httpRequest.status: 200
  selection_ua:
    httpRequest.userAgent|startswith:
      - 'curl/'
      - 'python'
      - 'Python'
      - 'sqlmap'
      - 'go-http-client'
      - 'PostmanRuntime'
  condition: selection and selection_ua
fields:
  - httpRequest.remoteIp
  - httpRequest.userAgent
falsepositives:
  - Scripts de smoke-test que hacen login con curl tras un escaneo
level: high
