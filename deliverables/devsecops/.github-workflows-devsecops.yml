# =====================================================================================
# SI3006 — Pipeline DevSecOps para OWASP Juice Shop
# Diseño: "shift left" con gates bloqueantes. La etapa de SAST es la que habría
# detenido la inyección SQL explotada en este trabajo.
# =====================================================================================
name: devsecops-juice-shop

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'          # re-escaneo semanal de dependencias e imagen

permissions:
  contents: read
  security-events: write          # para subir SARIF a GitHub Code Scanning
  packages: read

env:
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/juice-shop-lab/juice-shop

jobs:
  # ---------------------------------------------------------------- 1. SAST bloqueante
  sast:
    name: 1 · SAST (Semgrep) — gate bloqueante
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Reglas de inyección SQL (BLOQUEANTE)
        run: |
          semgrep scan --config p/sql-injection \
                       --severity ERROR --error \
                       --sarif --output semgrep-sqli.sarif \
                       routes/ models/ lib/
      - name: Barrido OWASP Top 10 (informativo, baseline)
        if: always()
        run: |
          semgrep scan --config p/owasp-top-ten --quiet --text routes/ models/ lib/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sarif-sast, path: semgrep-sqli.sarif }

  # ---------------------------------------------------------------- 2. SCA + SBOM
  sca:
    name: 2 · SCA + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --no-audit --no-fund
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::SCA con hallazgos (ver baseline)"
      - name: SBOM CycloneDX
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: bom.json }

  # ---------------------------------------------------------------- 3. Secrets + IaC
  secrets-iac:
    name: 3 · Gitleaks + Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (secretos en el repo)
        uses: gitleaks/gitleaks-action@v2
      - name: Checkov (Terraform de la arquitectura propuesta)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform
          soft_fail: true

  # ---------------------------------------------------------------- 4. Build + scan de imagen
  container:
    name: 4 · Build + Trivy + firma
    needs: [sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE:${{ github.sha }}" .
      - name: Trivy (CRITICAL bloquea)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
      - name: cosign (firma de la imagen)
        run: cosign sign --yes "$IMAGE:${{ github.sha }}"
      - run: docker push "$IMAGE:${{ github.sha }}"

  # ---------------------------------------------------------------- 5. Deploy canario
  deploy:
    name: 5 · Deploy canario (10 % → 100 %)
    needs: [container, sca]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CD_SERVICE_ACCOUNT }}
      - name: Desplegar revisión con 10 % del tráfico
        run: |
          gcloud run deploy juice-shop-si3006 \
            --image "$IMAGE:${{ github.sha }}" --region us-central1 \
            --no-allow-unauthenticated \
            --ingress internal-and-cloud-load-balancing \
            --service-account juice-shop-runtime@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com \
            --min-instances 1 --max-instances 3 --cpu 1 --memory 1Gi \
            --set-secrets DB_PASSWORD=db-password:latest,JWT_PRIVATE_KEY=jwt-key:latest \
            --no-traffic --tag canary
      - name: Smoke test + DAST sobre el canario
        run: |
          URL=$(gcloud run services describe juice-shop-si3006 --region us-central1 \
                --format='value(status.traffic[?tag=canary].url)' | head -1)
          curl -fsS "$URL/rest/admin/application-version"
          docker run --rm -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$URL" -I -m 2 -r zap.html || true
      - name: Promover a 100 %
        run: |
          gcloud run services update-traffic juice-shop-si3006 --region us-central1 --to-latest
